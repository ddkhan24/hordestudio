name: Attach Portable Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-checks:
    uses: ./.github/workflows/engine-checks.yml
  package:
    needs: engine-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and attach portable application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git tag --sort=-v:refname | head -n 1)
          test -n "$tag"
          git checkout --detach "$tag"
          node scripts/check-engine.js
          ./scripts/build-portable.sh "${tag#v}"
          gh release upload "$tag" \
            "dist/Horde-Studio-${tag}-portable.zip#Horde Studio portable app" \
            --clobber
