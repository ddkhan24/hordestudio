name: Attach Portable Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and attach (for example v18.2.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  engine-checks:
    uses: ./.github/workflows/engine-checks.yml
    with:
      source_ref: refs/tags/${{ inputs.tag }}
  package:
    needs: engine-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Build and attach portable application
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}([.-][A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          node scripts/check-engine.js
          ./scripts/build-portable.sh "${tag#v}"
          python3 scripts/verify-portable-package.py "dist/Horde-Studio-${tag}-portable.zip"
          gh release upload "$tag" \
            "dist/Horde-Studio-${tag}-portable.zip#Horde Studio portable app" \
            --clobber
